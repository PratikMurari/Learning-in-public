<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Vue.js Basics</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app">
      <span>{{emoji}}</span>
      <h1>{{status_code}}</h1>
      <p>{{status_message}}</p>
      <a href="https://www.scrimba.com" target="_blank">{{button}} →</a>
    </div>

    <script>
      const { createApp, ref } = Vue;
      createApp({
        setup() {
          const emoji = ref("😭");
          const status_code = ref("404");
          const status_message = ref("Awww... don't cry, it's just a 404");
          const button = ref("See you later 🐊! ");
          return { emoji, status_code, status_message, button };
        },
      }).mount("#app");
    </script>
  </body>
</html>

CHALLENGE: Turn this static 404 page into a Vue app using the CDN
           Make it your own by using a different emoji, status code, and text!
STEP 1: Include Vue CDN
        (https://unpkg.com/vue@3/dist/vue.global.js)
STEP 2: Prep your HTML by wrapping everything in #app
STEP 3: In new <script> tags, import the createApp and ref Vue functions
STEP 4: Create a Vue app instance and mount it
STEP 5: Create four ref() variables and use them to change the text
        content of the four elements (span, h1, p, and button)
